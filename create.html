<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Surprise | WishNest</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#ffe5ef,#fff8f4);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:30px;
}

.container{
width:100%;
max-width:650px;
background:white;
padding:35px;
border-radius:25px;
box-shadow:0 15px 40px rgba(0,0,0,.08);
}

h1{
text-align:center;
color:#ff4f8b;
margin-bottom:30px;
}

label{
display:block;
margin-top:18px;
margin-bottom:8px;
font-weight:600;
color:#444;
}

input,textarea{
width:100%;
padding:14px;
border:2px solid #ffd3e3;
border-radius:12px;
font-size:16px;
outline:none;
}

input:focus,
textarea:focus{
border-color:#ff4f8b;
}

textarea{
height:160px;
resize:none;
}

#preview{
display:flex;
flex-wrap:wrap;
gap:12px;
margin-top:20px;
}

#preview img{
width:90px;
height:90px;
object-fit:cover;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

button{
width:100%;
margin-top:30px;
padding:16px;
border:none;
border-radius:40px;
background:#ff4f8b;
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.03);
background:#ff2f78;
}

</style>

</head>

<body>

<div class="container">

<h1>Create Your Surprise ❤️</h1>

<label>Recipient's Name</label>
<input type="text" placeholder="e.g. Ayush">

<label>Your Letter</label>
<textarea placeholder="Write your heartfelt message..."></textarea>

<label>Upload Photos</label>

<input
type="file"
id="photos"
multiple
accept="image/*">

<div id="preview"></div>

<button onclick="window.location.href='surprise.html'">
Generate Surprise
</button>

</div>

<script>

const photoInput=document.getElementById("photos");
const preview=document.getElementById("preview");

photoInput.addEventListener("change",function(){

preview.innerHTML="";

Array.from(this.files).forEach(file=>{

const reader=new FileReader();

reader.onload=function(e){

const img=document.createElement("img");

img.src=e.target.result;

preview.appendChild(img);

}

reader.readAsDataURL(file);

});

});

</script>

</body>
</html>
