<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Surprise | WishNest</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#ffe5ef,#fff8f4);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:30px;
}

.container{
width:100%;
max-width:600px;
background:white;
padding:35px;
border-radius:25px;
box-shadow:0 15px 40px rgba(0,0,0,.08);
}

h1{
text-align:center;
color:#ff4f8b;
margin-bottom:25px;
}

label{
display:block;
margin-top:18px;
margin-bottom:8px;
font-weight:600;
}

input, textarea{
width:100%;
padding:14px;
border:2px solid #ffd1e2;
border-radius:12px;
font-size:16px;
outline:none;
}

textarea{
height:150px;
resize:none;
}

button{
width:100%;
margin-top:30px;
padding:16px;
background:#ff4f8b;
color:white;
border:none;
border-radius:40px;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.03);
}

</style>

</head>

<body>

<div class="container">

<h1>Create Your Surprise ❤️</h1>

<label>Recipient's Name</label>
<input type="text" placeholder="e.g. Ayush">

<label>Your Letter</label>
<textarea placeholder="Write something beautiful..."></textarea>

<label>Upload Photos</label>
<input type="file" multiple>

<button>Generate Surprise</button>

</div>

</body>
</html>
