<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Cake 🎂</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#FFE8F3,#FFF9F5);
overflow:hidden;
}

.container{
text-align:center;
}

h1{
color:#ff4f8b;
margin-bottom:10px;
}

p{
color:#666;
margin-bottom:40px;
}

.cake{
font-size:170px;
transition:.4s;
}

#candles{
font-size:50px;
margin-bottom:-20px;
transition:.4s;
}

button{
margin-top:30px;
padding:15px 35px;
border:none;
border-radius:40px;
background:#ff4f8b;
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

#cutBtn,
#nextBtn{
display:none;
}

</style>

</head>

<body>

<div class="container">

<h1>🎂 Make a Birthday Wish!</h1>

<p>Blow out the candles and cut the cake.</p>

<div id="candles">🕯️ 🕯️ 🕯️</div>

<div class="cake">
🎂
</div>

<button id="blowBtn">
Blow Candles
</button>

<button id="cutBtn">
Cut Cake 🍰
</button>

<button id="nextBtn" onclick="window.location.href='flowers.html'">
Receive Flowers 💐
</button>

</div>

<script>

const candles=document.getElementById("candles");
const blow=document.getElementById("blowBtn");
const cut=document.getElementById("cutBtn");
const next=document.getElementById("nextBtn");

blow.onclick=function(){

candles.innerHTML="💨 💨 💨";

blow.style.display="none";

cut.style.display="inline-block";

}

cut.onclick=function(){

document.querySelector(".cake").innerHTML="🍰 🍰";

cut.style.display="none";

next.style.display="inline-block";

}

</script>

</body>
</html>
