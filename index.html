<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WishNest</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
background:linear-gradient(135deg,#ffe5ef,#fff8f4);
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.hero{
text-align:center;
animation:fadeIn 1.5s ease;
}

h1{
font-size:70px;
color:#ff4f8b;
margin-bottom:20px;
}

p{
font-size:22px;
color:#555;
margin-bottom:40px;
}

button{
padding:18px 45px;
font-size:20px;
border:none;
border-radius:50px;
background:#ff4f8b;
color:white;
cursor:pointer;
transition:.3s;
box-shadow:0 10px 25px rgba(255,79,139,.3);
}

button:hover{
transform:translateY(-5px) scale(1.05);
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.heart{
position:absolute;
font-size:25px;
animation:float 8s linear infinite;
opacity:.4;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:0;
}
20%{
opacity:.5;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}

</style>

</head>

<body>

<div class="hero">

<h1>🎁 WishNest</h1>

<p>Turn your memories into unforgettable surprise websites.</p>

<button onclick="alert('Birthday Creator Coming Soon ❤️')">
Create a Surprise
</button>

</div>

<script>

const emojis=["💖","💕","🌸","✨","🎈"];

setInterval(()=>{

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML=emojis[Math.floor(Math.random()*emojis.length)];

heart.style.left=Math.random()*100+"vw";

heart.style.animationDuration=5+Math.random()*5+"s";

heart.style.fontSize=20+Math.random()*20+"px";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},10000);

},500);

</script>

</body>
</html>
