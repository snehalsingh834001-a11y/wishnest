<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Surprise Awaits ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffe7f2,#fff8f5);
overflow:hidden;
}

.container{
text-align:center;
animation:fadeIn 1.5s ease;
}

h1{
font-size:42px;
color:#ff4f8b;
margin-bottom:15px;
}

p{
font-size:20px;
color:#666;
margin-bottom:40px;
}

.gift{
font-size:150px;
cursor:pointer;
animation:bounce 2s infinite;
transition:.3s;
}

.gift:hover{
transform:scale(1.1) rotate(-5deg);
}

button{
margin-top:35px;
padding:16px 40px;
border:none;
border-radius:40px;
background:#ff4f8b;
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;
box-shadow:0 10px 25px rgba(255,79,139,.3);
}

button:hover{
transform:scale(1.05);
}

.sparkle{
position:absolute;
font-size:22px;
animation:float 8s linear infinite;
opacity:.5;
}

@keyframes bounce{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-20px);
}
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:0;
}
20%{
opacity:.6;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}

</style>

</head>

<body>

<div class="container">

<h1>🎁 A Special Surprise Awaits...</h1>

<p>Someone has prepared something with lots of love just for you.</p>

<div class="gift">🎁</div>

<button onclick="window.location.href='balloons.html'">
Open Gift
</button>

</div>

<script>

const emojis=["✨","💖","🌸","💕","⭐"];

setInterval(()=>{

let s=document.createElement("div");

s.className="sparkle";

s.innerHTML=emojis[Math.floor(Math.random()*emojis.length)];

s.style.left=Math.random()*100+"vw";

s.style.animationDuration=5+Math.random()*5+"s";

s.style.fontSize=20+Math.random()*18+"px";

document.body.appendChild(s);

setTimeout(()=>{
s.remove();
},9000);

},400);

</script>

</body>
</html>
