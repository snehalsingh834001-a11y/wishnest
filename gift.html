<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WishNest | A Surprise Awaits</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
position:relative;
overflow:hidden;
}

.sky{
position:absolute;
inset:0;
background:
linear-gradient(#e9f8ff,#fdfcf8);
}

.cloud{
position:absolute;
background:white;
border-radius:50px;
opacity:.8;
filter:blur(1px);
animation:moveCloud 35s linear infinite;
}

.cloud::before,
.cloud::after{
content:"";
position:absolute;
background:white;
border-radius:50%;
}

.cloud::before{
width:60px;
height:60px;
left:15px;
top:-25px;
}

.cloud::after{
width:80px;
height:80px;
left:55px;
top:-35px;
}

.c1{
width:140px;
height:50px;
left:-180px;
top:80px;
}

.c2{
width:180px;
height:60px;
left:-250px;
top:220px;
animation-duration:48s;
}

.card{

position:relative;

background:rgba(255,255,255,.75);

backdrop-filter:blur(12px);

padding:50px;

border-radius:30px;

text-align:center;

box-shadow:0 20px 45px rgba(0,0,0,.1);

z-index:2;

}

h1{

font-size:52px;

margin-bottom:10px;

color:#5d4b3c;

}

p{

font-size:18px;

color:#666;

margin-bottom:35px;

}

.gift{

font-size:120px;

animation:floatGift 3s ease-in-out infinite;

}

button{

margin-top:25px;

}

@keyframes floatGift{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-18px);

}

}

@keyframes moveCloud{

from{

transform:translateX(0);

}

to{

transform:translateX(calc(100vw + 400px));

}

}

</style>

</head>

<body>

<div class="sky">

<div class="cloud c1"></div>

<div class="cloud c2"></div>

</div>

<div class="card">

<div class="gift">
    <img src="assets/images/gift.svg" alt="Gift">
</div>

<h1>A Little Surprise Awaits...</h1>

<p>Someone has created a magical journey just for you.</p>

<button id="openBtn">

Open Gift

</button>

</div>

<script>

document.getElementById("openBtn").onclick=()=>{

document.querySelector(".gift").style.transform="scale(1.2) rotate(12deg)";

setTimeout(()=>{

window.location.href="balloons.html";

},700);

}

</script>

</body>
</html>
