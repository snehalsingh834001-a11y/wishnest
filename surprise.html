<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Surprise ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#ffe5ef,#fff8f4);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:30px;
}

.container{
max-width:850px;
width:100%;
background:white;
padding:40px;
border-radius:25px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,.1);
animation:fade 1s ease;
}

h1{
font-size:55px;
color:#ff4f8b;
margin-bottom:15px;
}

h2{
color:#666;
margin-bottom:30px;
}

.letter{
background:#fff6fa;
padding:25px;
border-radius:18px;
font-size:18px;
line-height:1.8;
color:#444;
white-space:pre-wrap;
margin-top:30px;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>

</head>

<body>

<div class="container">

<h1>🎉 Happy Birthday <span id="personName"></span> 🎂</h1>

<h2>Someone made this just for you ❤️</h2>

<div class="letter" id="letterBox"></div>

</div>

<script>

const name = localStorage.getItem("name");
const letter = localStorage.getItem("letter");

document.getElementById("personName").innerText =
name || "Special Person";

document.getElementById("letterBox").innerText =
letter || "No letter found.";

</script>

</body>
</html>
