<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Surprise ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#ffe5ef,#fff8f4);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:40px;
overflow:hidden;
}

.container{
background:white;
width:90%;
max-width:800px;
padding:40px;
border-radius:25px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,.1);
animation:fade 1s ease;
}

h1{
font-size:55px;
color:#ff4f8b;
margin-bottom:20px;
}

h2{
color:#444;
margin-bottom:25px;
}

p{
font-size:18px;
line-height:1.8;
color:#666;
margin-bottom:30px;
}

.gallery{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:15px;
margin-top:20px;
}

.gallery img{
width:150px;
height:150px;
border-radius:20px;
object-fit:cover;
box-shadow:0 10px 25px rgba(0,0,0,.15);
}

@keyframes fade{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>

</head>

<body>

<div class="container">

<h1>🎉 Happy Birthday! 🎂</h1>

<h2>This page will soon become someone's special surprise ❤️</h2>

<p>
Every memory deserves a beautiful place.
This is the first version of WishNest.
Soon, your photos, letter, music and memories will appear here automatically.
</p>

<div class="gallery">

<img src="https://picsum.photos/200?1">

<img src="https://picsum.photos/200?2">

<img src="https://picsum.photos/200?3">

</div>

</div>

</body>
</html>
