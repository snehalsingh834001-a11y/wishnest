<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pop the Balloons 🎈</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
overflow:hidden;
background:linear-gradient(135deg,#FFE5F0,#FFF8F5);
}

h1{
text-align:center;
margin-top:25px;
color:#ff4f8b;
}

p{
text-align:center;
color:#555;
margin-top:10px;
}

#game{
position:relative;
width:100%;
height:80vh;
}

.balloon{
position:absolute;
font-size:60px;
cursor:pointer;
user-select:none;
transition:.2s;
animation:floatUp 12s linear forwards;
}

.balloon:hover{
transform:scale(1.1);
}

.counter{
text-align:center;
font-size:22px;
margin-top:20px;
font-weight:bold;
color:#444;
}

button{
display:none;
margin:30px auto;
padding:15px 35px;
border:none;
border-radius:40px;
background:#ff4f8b;
color:white;
font-size:18px;
cursor:pointer;
}

@keyframes floatUp{
from{
transform:translateY(120vh);
}
to{
transform:translateY(-120vh);
}
}

</style>
</head>

<body>

<h1>🎈 Pop All The Balloons!</h1>

<p>Pop every balloon to unlock your birthday surprise.</p>

<div class="counter">
Remaining: <span id="remaining">10</span>
</div>

<div id="game"></div>

<button id="nextBtn" onclick="window.location.href='cake.html'">
Next Surprise →
</button>

<script>

let total=10;

const game=document.getElementById("game");
const remain=document.getElementById("remaining");
const btn=document.getElementById("nextBtn");

function createBalloon(){

const b=document.createElement("div");

b.className="balloon";

b.innerHTML="🎈";

b.style.left=Math.random()*90+"vw";

b.style.bottom="-100px";

b.onclick=function(){

b.remove();

total--;

remain.innerText=total;

if(total==0){

btn.style.display="block";

}

}

game.appendChild(b);

}

for(let i=0;i<10;i++){

createBalloon();

}

</script>

</body>
</html>
